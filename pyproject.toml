[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2x-advisory-governance"
version = "0.1.0"
description = "Deadline-aware governance benchmark for connected-mobility advisories"
requires-python = ">=3.11"
dependencies = ["eclipse-sumo==1.27.1", "traci==1.27.1", "sumolib==1.27.1", "sumo-data==1.27.1", "httpx", "python-dotenv", "numpy", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
